name: Relay Server Daemon

on:
  workflow_dispatch:
  schedule:
    # Fallback cron trigger (every 30 minutes to restart if runner terminates)
    - cron: '*/30 * * * *'

permissions: write-all

jobs:
  relay_runner:
    name: Execute Relay Server
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Relay Server App
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: "server.yml"
          WORKFLOW_REF: "main"
          # Run duration: 330 minutes (5.5 hours) before graceful handoff
          RUN_DURATION_SECONDS: "19800"
        run: |
          python app.py
